# Re-download results and sportsbook lines, refresh the trained wager model's team state (no
# retraining: the model comes from the predictions-webdata release, see Train predictions),
# export every predictions page's JSON and write it to the Cloud Storage bucket that the Cloud
# Run service mounts at RUNITBACK_PREDICTIONS (see README, "Predictions data"). The app is not
# redeployed: the pages pick up the new files within a minute. A failed run leaves the
# published data in place. Ported from sportsml's Site workflow.
#
# The NFL model's history tokens include each game's play-by-play embedding: the games played
# since the last run are embedded with the model's foundation fold (the `foundation-nfl` release,
# see Train predictions) before the export, and every game's player values are rebuilt from the
# latest depth charts and injury reports (`runitback nfl player-values`): the model's lineup terms
# and the game pages' lineup editor read them.
#
# The players page (player values ranked by position) is exported from the same player values.
#
# The NBA is exported from the same webdata: its player values (rotations from rosters and the
# injury report) are rebuilt below, and the lineup editor and players page read them. The WNBA's
# (W2) are rebuilt the same way, once Train has published the WNBA.
#
# College football is exported from the same webdata: the folds' newly played games are embedded and
# keyed for the wager model, and the quarterback values rebuilt (depth is not needed: the projected
# starter is each team's last one). Its lines are ESPN's (no key, no quota), one request per game, so
# the finished games' lines, schedules and box scores come from the `cfb-espn-cache` release that
# Train predictions keeps and a run only requests the newest games (about a hundred).
#
# Lines come from The Odds API (ODDS_API_KEY secret; no game within 8 days: no request). The
# schedule fits its free tier's 150 requests a month: about 23 runs a week in season, more on
# game days (times in UTC, before each Eastern kickoff window). Without the key the previous
# export's lines carry over. NBA lines (about 3 requests each) are fetched only by the daily
# run and by manual runs, so the extra cost is about 30 requests a month; the other runs carry
# the NBA's previous lines over.
#
# Each sport runs in its own job, at the same time (the run takes as long as its slowest sport, not
# all of them in turn): `plan` lists the sports the webdata has and fetches the published data once;
# `export` exports one sport per matrix job (`web export --sports`); `publish` merges the parts
# (`web merge`) and writes the bucket. A sport whose job fails keeps its published files, and the
# other sports are published without it (the run still shows the failure); if no sport is exported,
# or a failed sport has never been published, nothing is.
name: Refresh predictions

on:
  workflow_dispatch:
    inputs:
      webdata_sha256:
        description: The predictions-webdata asset to wait for (set by Train predictions)
        required: false
        default: ""
  schedule:
    - cron: "17 10 * * *" # daily, early morning US time
    - cron: "17 6 * * 2" # Tuesday, after Monday night's game
    - cron: "17 16,22 * * 2-6" # Tue-Sat midday and evening lines
    - cron: "17 16 * * 0" # Sunday morning, before the 1 pm games
    - cron: "47 19 * * 0" # before the late afternoon games
    - cron: "47 23 * * 0,1,4" # before Sunday, Monday and Thursday night

permissions:
  contents: read
  id-token: write # Workload Identity Federation

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  MLFLOW_DISABLE_AGENT_HINT: "1"
  RUNITBACK_NFL_FOUNDATION: foundation/nfl
  RUNITBACK_NFL_PLAYER_VALUES: player_values/nfl
  RUNITBACK_NBA_PLAYER_VALUES: player_values/nba
  RUNITBACK_WNBA_PLAYER_VALUES: player_values/wnba
  RUNITBACK_CFB_FOUNDATION: foundation/cfb
  RUNITBACK_CFB_PLAYER_VALUES: player_values/cfb
  RUNITBACK_WCBB_PLAYER_VALUES: player_values/wcbb

concurrency:
  group: refresh-predictions
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # the Google Cloud settings live with the deploy's; if that environment requires a reviewer,
    # put these secrets in an environment without one (scheduled runs would otherwise wait)
    environment: production
    env:
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      PREDICTIONS_BUCKET: ${{ secrets.PREDICTIONS_BUCKET }}
    outputs:
      webdata_sha256: ${{ steps.webdata.outputs.sha256 }}
      sports: ${{ steps.webdata.outputs.sports }}
      sports_list: ${{ steps.webdata.outputs.sports_list }}
    steps:
      - name: Check configuration
        run: |
          missing=""
          for v in GOOGLE_CLOUD_PROJECT GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOY_SERVICE_ACCOUNT PREDICTIONS_BUCKET; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            printf 'Missing secret(s) in the production environment:%s\n' "$missing" >&2
            exit 1
          fi
      - uses: actions/checkout@v5
      - name: Fetch the trained model, list its sports
        id: webdata
        env:
          WANT: ${{ inputs.webdata_sha256 }}
        run: |
          source scripts/ci/release.sh
          fetch_webdata "$WANT"
          echo "sha256=$(sha256sum webdata.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          # the sports Train has published (the WNBA, college football and basketball only once it has)
          sports=""
          for s in nfl nba wnba cfb wcbb cbb; do
            if [ -f "webdata/$s/meta.json" ]; then sports="${sports:+$sports,}$s"; fi
          done
          [ -n "$sports" ] || { echo "::error::webdata has no sport to export"; exit 1; }
          echo "sports exported: $sports"
          echo "sports_list=$sports" >> "$GITHUB_OUTPUT"
          echo "sports=[\"${sports//,/\",\"}\"]" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Fetch the published data (line history, reusable challenge files)
        run: |
          mkdir previous
          gcloud storage cp -r "gs://$PREDICTIONS_BUCKET/*" previous/ \
            || echo "nothing published yet: a full export"
          # the artifact is never empty (a first run's previous/ would be)
          date -u +%FT%TZ > previous/fetched-at.txt
      - uses: actions/upload-artifact@v4
        with:
          name: previous
          path: previous
          retention-days: 1

  export:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # for ODDS_API_KEY and CBBD_API_KEY, wherever they are kept
    environment: production
    strategy:
      fail-fast: false # one sport's failure leaves the others to publish
      matrix:
        sport: ${{ fromJSON(needs.plan.outputs.sports) }}
    name: export (${{ matrix.sport }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[data,wager]"
      - name: Fetch the trained model
        run: |
          source scripts/ci/release.sh
          fetch_webdata "${{ needs.plan.outputs.webdata_sha256 }}"
      - uses: actions/download-artifact@v4
        with:
          name: previous
          path: previous
      - name: Embed the games played since
        if: matrix.sport == 'nfl'
        run: |
          end=$(python -c "import datetime as d; t=d.date.today(); print(t.year if t.month >= 9 else t.year - 1)")
          runitback nfl download --start 1999 --end "$end"
          runitback nfl preprocess --start 1999 --end "$end"
          mkdir -p "$RUNITBACK_NFL_FOUNDATION" folds
          # the two latest folds: the model's (the current season's, or last season's until the
          # next Train predictions run after a new season starts)
          for a in $(gh release view foundation-nfl --json assets -q '.assets[].name' 2>/dev/null | sort | tail -2); do
            gh release download foundation-nfl --pattern "$a" --dir folds
            mkdir -p "$RUNITBACK_NFL_FOUNDATION/${a%.tar.gz}"
            tar -xzf "folds/$a" -C "$RUNITBACK_NFL_FOUNDATION/${a%.tar.gz}"
          done
          runitback nfl foundation --root "$RUNITBACK_NFL_FOUNDATION" --existing --threads $(nproc)
      - name: Player values (latest depth charts and injury reports)
        if: matrix.sport == 'nfl'
        run: runitback nfl player-values --out "$RUNITBACK_NFL_PLAYER_VALUES"
      - name: NBA player values (rotations from rosters and the injury report)
        if: matrix.sport == 'nba'
        run: |
          runitback nba download --start 2015 --end 2027
          runitback nba players --start 2015 --end 2027
          runitback nba lineups --live
          runitback nba player-values --start 2015 --end 2027 --out "$RUNITBACK_NBA_PLAYER_VALUES" \
            --lineups data/nba/processed/projected_lineups.parquet \
            --upcoming data/nba/processed/projected_lineups_upcoming.parquet
      - name: WNBA player values (rotations from rosters and the injury report)
        if: matrix.sport == 'wnba'
        run: |
          runitback wnba download --start 2006 --end 2027
          runitback wnba players --start 2006 --end 2027
          runitback wnba lineups --live
          runitback wnba player-values --start 2006 --end 2027 --out "$RUNITBACK_WNBA_PLAYER_VALUES" \
            --lineups data/wnba/processed/projected_lineups.parquet \
            --upcoming data/wnba/processed/projected_lineups_upcoming.parquet
      - name: Women's college player values (rotations from rosters for upcoming games)
        if: matrix.sport == 'wcbb'
        run: |
          runitback college download --gender wcbb
          runitback college players --gender wcbb
          runitback college lineups --gender wcbb --live --days 3
          runitback college player-values --gender wcbb --out "$RUNITBACK_WCBB_PLAYER_VALUES"
          # the finished games' lines Train kept, so the export only requests the newest games'
          source scripts/ci/release.sh
          mkdir -p data/wcbb/espn_cache
          fetch_asset wcbb-espn-cache wcbb-espn-cache.tar.gz dl/wcbb
          tar -xzf dl/wcbb/wcbb-espn-cache.tar.gz -C data/wcbb/espn_cache
      - name: Men's college lines cache
        # the finished games' lines Train kept
        if: matrix.sport == 'cbb'
        run: |
          source scripts/ci/release.sh
          mkdir -p data/cbb/espn_cache
          fetch_asset cbb-espn-cache cbb-espn-cache.tar.gz dl/cbb
          tar -xzf dl/cbb/cbb-espn-cache.tar.gz -C data/cbb/espn_cache
      - name: CFB folds (embed the games played since), quarterback values, cached lines
        if: matrix.sport == 'cfb'
        run: |
          source scripts/ci/release.sh
          end=$(python -c "import datetime as d; t=d.date.today(); print(t.year if t.month >= 9 else t.year - 1)")
          runitback cfb download --start 2004 --end "$end"
          runitback cfb preprocess --start 2004 --end "$end"
          runitback cfb players --start 2012 --end "$end"
          # the model's folds by season, not "the latest two": Train replaces a fold's asset while it
          # uploads. Last season's must exist; this season's may not until Train has trained it.
          fetch_folds cfb "$RUNITBACK_CFB_FOUNDATION" $((end - 1)) -- "$end"
          runitback cfb foundation --root "$RUNITBACK_CFB_FOUNDATION" --existing --threads $(nproc)
          seasons=""
          for d in "$RUNITBACK_CFB_FOUNDATION"/fold*; do seasons="$seasons --season ${d##*fold}"; done
          runitback cfb wager-embeddings --root "$RUNITBACK_CFB_FOUNDATION" $seasons --end "$end"
          runitback cfb player-values --start 2012 --end "$end" --jobs $(nproc) --out "$RUNITBACK_CFB_PLAYER_VALUES"
          mkdir -p data/cfb/espn_cache
          fetch_asset cfb-espn-cache cfb-espn-cache.tar.gz dl/cfb
          tar -xzf dl/cfb/cfb-espn-cache.tar.gz -C data/cfb/espn_cache
      - name: Export fresh data and lines
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # men's college basketball: finished games' lines (without it the export would request ~85,000)
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          SCHEDULE: ${{ github.event.schedule }}
          SPORT: ${{ matrix.sport }}
        run: |
          odds="{nfl: oddsapi, cfb: espn}"
          # NBA lines: the daily run and manual runs only (The Odds API's monthly quota)
          if [ -z "$SCHEDULE" ] || [ "$SCHEDULE" = "17 10 * * *" ]; then
            odds="{nfl: oddsapi, nba: oddsapi, cfb: espn}"
          fi
          runitback-wager web export --data_dir webdata --output_dir out --sports "[$SPORT]" \
            --refresh true --require_refresh false --odds "$odds" \
            --odds_history previous --challenge_from previous \
            --player_values "{nfl: $RUNITBACK_NFL_PLAYER_VALUES, nba: $RUNITBACK_NBA_PLAYER_VALUES, wnba: $RUNITBACK_WNBA_PLAYER_VALUES}"
          python -c "import json,sys; s=[i['sport'] for i in json.load(open('out/data/sports.json'))]; sys.exit(0 if s == ['$SPORT'] else f'exported {s}, not $SPORT')"
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.sport }}
          path: out/data
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [plan, export]
    # also when some sport's export failed: the others are published, the failed one keeps its files
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      PREDICTIONS_BUCKET: ${{ secrets.PREDICTIONS_BUCKET }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[data,wager]"
      - uses: actions/download-artifact@v4
        with:
          name: previous
          path: previous
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts
      - name: Merge the sports
        env:
          SPORTS: ${{ needs.plan.outputs.sports_list }}
        run: |
          mkdir -p parts
          runitback-wager web merge --parts_dir parts --output_dir out \
            --sports "[$SPORTS]" --previous previous
          # a run that fetched no NBA lines keeps the published ones (the sync below deletes
          # what is missing from out/data)
          if [ ! -f out/data/nba/odds.json ] && [ -f previous/nba/odds.json ]; then
            mkdir -p out/data/nba && cp previous/nba/odds.json out/data/nba/odds.json
          fi
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Publish to the bucket
        # files first, then removals: a page loading mid-sync sees old or new files, never none
        run: |
          echo "$GITHUB_SHA" > out/data/export-sha.txt
          gcloud storage rsync --recursive --cache-control=no-cache out/data "gs://$PREDICTIONS_BUCKET"
          gcloud storage rsync --recursive --delete-unmatched-destination-objects out/data "gs://$PREDICTIONS_BUCKET"
          echo "published $(find out/data -name '*.json' | wc -l) files to gs://$PREDICTIONS_BUCKET"
