# N5 (docs/multisport/PLAN.md): the NBA wager model on the foundation (pbp32) and the player values
# (pvc), walk-forward over 2022-2026 (experiments/nba/wager.yaml):
#
#   inputs (games with lines, foundation folds) ─┐
#   values (players, projected lineups, weekly values) ─┴─► arms (config × season) ─► report
#                                                        └─► swap (2026: one home starter changed)
#
# Every input is rebuilt from the public sources in the run (nba-experiment-inputs.yml for the games
# and folds; the values job downloads the ESPN play-by-play and player box scores, builds N1's
# on-court fives, N3's projected lineups and N2's weekly values on them). The report scores every
# arm against prod (1 seed) and the 4-seed ensembles against each other, on all games and on the
# games where the projected rotation moved, and adds the swap test; it is uploaded as the
# nba-wager-results artifact. Nothing is committed.
#
# Runs when this file or experiments/nba/wager.yaml changes on a claude/ branch, or by hand.
name: NBA wager experiment

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - .github/workflows/nba-wager-experiment.yml
      - experiments/nba/wager.yaml

permissions:
  contents: read

concurrency:
  group: nba-wager-experiment-${{ github.ref }}
  cancel-in-progress: true

env:
  MLFLOW_DISABLE_AGENT_HINT: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  inputs:
    uses: ./.github/workflows/nba-experiment-inputs.yml
    with:
      seasons: "[2022, 2023, 2024, 2025, 2026]"
      lines: true

  values:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[data,wager]"
      - name: Play-by-play and player box scores, on-court fives, projected lineups, weekly values
        run: |
          runitback nba download --start 2015 --end 2027 --players
          runitback nba players --start 2015 --end 2027
          runitback nba lineups
          runitback nba player-values --start 2015 --end 2027 --jobs $(nproc) \
            --lineups data/nba/processed/projected_lineups.parquet --out player_values/nba
          python - <<'PY'
          import pandas as pd
          pv = pd.read_parquet("player_values/nba/pv.parquet")
          pl = pd.read_parquet("data/nba/processed/projected_lineups.parquet")
          print(len(pv), "team-games;", pv.game_id.nunique(), "games;", pl.source.value_counts().to_dict())
          print(pv.describe().T[["mean", "std", "min", "max"]].round(2).to_string())
          PY
          mkdir -p swapdata
          cp data/nba/processed/{possessions,player_games,players,projected_lineups}.parquet swapdata/
      - uses: actions/upload-artifact@v4
        with: { name: nba-playervalues, path: player_values/nba, retention-days: 30 }
      - uses: actions/upload-artifact@v4
        with: { name: nba-swapdata, path: swapdata, retention-days: 7 }

  arms:
    needs: [inputs, values]
    runs-on: ubuntu-latest
    # one fit takes about 25 minutes, a 4-seed ensemble about 100
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        config: [pbp32_pvc_e4, pbp32_e4, prod_e4, prod_pvc_e4, prod, pbp32, pbp32_pvc]
        season: [2022, 2023, 2024, 2025, 2026]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[wager]"
      - uses: actions/download-artifact@v4
        with: { name: nba-data, path: data/nba }
      - uses: actions/download-artifact@v4
        with: { name: "nba-fold${{ matrix.season }}", path: "runs/foundation/fold${{ matrix.season }}" }
      - uses: actions/download-artifact@v4
        with: { name: nba-playervalues, path: player_values/nba }
      - name: Backtest ${{ matrix.config }} on ${{ matrix.season }}
        run: |
          python scripts/wager_arm.py ${{ matrix.config }} ${{ matrix.season }} --sport nba \
            --experiment experiments/nba/wager.yaml --output-dir runs/wager --threads $(nproc)
          mkdir -p out/${{ matrix.config }}
          cp runs/wager/${{ matrix.config }}/${{ matrix.season }}.csv out/${{ matrix.config }}/
      - uses: actions/upload-artifact@v4
        with: { name: "arm-${{ matrix.config }}-${{ matrix.season }}", path: out, retention-days: 30 }

  swap:
    needs: [inputs, values]
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[wager]"
      - uses: actions/download-artifact@v4
        with: { name: nba-data, path: data/nba }
      - uses: actions/download-artifact@v4
        with: { name: nba-fold2026, path: runs/foundation/fold2026 }
      - uses: actions/download-artifact@v4
        with: { name: nba-playervalues, path: player_values/nba }
      - uses: actions/download-artifact@v4
        with: { name: nba-swapdata, path: data/nba/processed }
      - name: Swap test (2026, pbp32_pvc_e4 fit on the seasons before)
        run: |
          mkdir -p out
          python scripts/nba_lineup_swap.py --season 2026 --config pbp32_pvc_e4 --out out/swap_2026.csv \
            --threads $(nproc)
          cat out/swap_2026.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: nba-swap, path: out, retention-days: 30 }

  report:
    needs: [inputs, values, arms, swap]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[wager]"
      - uses: actions/download-artifact@v4
        with: { name: nba-data, path: data/nba }
      - uses: actions/download-artifact@v4
        with: { name: nba-playervalues, path: player_values/nba }
      - uses: actions/download-artifact@v4
        with: { pattern: "arm-*", path: experiments/nba/wager, merge-multiple: true }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: nba-swap, path: experiments/nba/wager/swap }
      - name: Score
        run: |
          R=experiments/nba/wager
          S="2022, 2023, 2024, 2025, 2026"
          ls $R
          # single seeds against prod
          O=$R/single; mkdir -p $O
          for c in prod pbp32 pbp32_pvc; do [ -d $R/$c ] && cp -r $R/$c $O/; done
          # the 4-seed ensembles against each other
          E=$R/e4; mkdir -p $E
          for c in prod_e4 pbp32_e4 pbp32_pvc_e4 prod_pvc_e4; do [ -d $R/$c ] && cp -r $R/$c $E/; done
          python - <<PY
          import pathlib
          from runitback.wager.experiments import ablate
          seasons = [$S]
          for d, base in (("$O", "prod"), ("$E", "prod_e4")):
              have = {p.name: {} for p in sorted(pathlib.Path(d).iterdir())
                      if p.is_dir() and all((p / f"{s}.csv").exists() for s in seasons)}
              print(d, "complete:", list(have))
              if base in have:
                  ablate("data/nba/games.csv", "nba", {base: {}} | have, seasons, d, base, 1, 1)
          PY
          python scripts/foundation_report.py $O --baseline prod --out $O/report.md
          python scripts/foundation_report.py $E --baseline prod_e4 --out $E/report.md
          python scripts/foundation_report.py $E --baseline pbp32_e4 --out $E/report_vs_pbp32.md
          python scripts/lineup_report.py $E --baseline prod_e4 --pv player_values/nba/pv.parquet --sport nba \
            --out $E/subsets.md
          python scripts/lineup_report.py $E --baseline pbp32_e4 --pv player_values/nba/pv.parquet --sport nba \
            --out $E/subsets_vs_pbp32.md
          {
            echo "## NBA wager experiment"
            echo "### 1 seed vs prod"; cat $O/ablation.md; echo; cat $O/report.md; echo
            echo "### 4 seeds vs prod_e4"; cat $E/ablation.md; echo; cat $E/report.md; echo
            echo "### 4 seeds vs pbp32_e4"; cat $E/report_vs_pbp32.md; echo
            echo "### Rotation-moved subsets (vs prod_e4)"; cat $E/subsets.md; echo
            echo "### Swap test"; cat $R/swap/swap_2026.md 2>/dev/null || echo "(no swap results)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: nba-wager-results, path: experiments/nba/wager, retention-days: 90 }
