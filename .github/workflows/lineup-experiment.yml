# The NFL lineup experiment (experiments/nfl/lineups.yaml): does the game being predicted's
# projected lineup help the wager model? Reuses the foundation experiment's per-season play-by-play
# models (run FOUNDATION_RUN's fold<season> artifacts), so nothing is retrained:
#
#   data ─► lineup tables (5 seasons) ─► arms (6 configurations × 5 seasons) ─► report
#
# The report job scores every arm against pbp32 (production) overall and on the games where the
# lineup moved, and commits the results to the branch it ran on.
name: Lineup experiment

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - .github/workflows/lineup-experiment.yml
      - experiments/nfl/lineups.yaml

permissions:
  contents: write  # the report job commits the results
  actions: read    # the foundation run's artifacts

concurrency:
  group: lineup-experiment-${{ github.ref }}
  cancel-in-progress: true

env:
  MLFLOW_DISABLE_AGENT_HINT: "1"
  PYTHONUNBUFFERED: "1"
  FOUNDATION_RUN: "42286987708"

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[data,wager]"
      - name: Play-by-play (runitback) and games with lines (wager model)
        run: |
          runitback nfl download --start 1999 --end 2026 & pbp=$!
          runitback-wager nfl download --output_file data/nfl/raw.csv & games=$!
          wait $pbp && wait $games
          runitback nfl preprocess --start 1999 --end 2026
          runitback-wager nfl process --games data/nfl/raw.csv --output_file data/nfl/games.csv
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-data
          path: |
            data/nfl/processed
            data/nfl/games.csv
          retention-days: 7

  lineup:
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        season: [2021, 2022, 2023, 2024, 2025]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[wager]"
      - uses: actions/download-artifact@v4
        with: { name: nfl-data, path: data/nfl }
      - uses: actions/download-artifact@v4
        with:
          name: "fold${{ matrix.season }}"
          path: "runs/foundation/fold${{ matrix.season }}"
          run-id: ${{ env.FOUNDATION_RUN }}
          github-token: ${{ github.token }}
      - name: Projected lineups and lineup context (fold ${{ matrix.season }})
        run: |
          S=${{ matrix.season }}
          mkdir -p data/nfl/raw
          runitback nfl lineup-features --ckpt runs/foundation/fold$S/model.pt \
            --out runs/foundation/fold$S/emb --fold $S --sets lu --sets cf --threads $(nproc)
          mkdir -p out/changes
          python -c "import pandas as pd; t = pd.read_parquet('runs/foundation/fold$S/emb/lineup.parquet'); \
            t[t.season == $S][['game_id', 'team', '_qb_change', '_qb_change_actual', '_dropped']].to_csv('out/changes/$S.csv', index=False)"
          cp runs/foundation/fold$S/emb/lineup.parquet out/
      - uses: actions/upload-artifact@v4
        with:
          name: lineup${{ matrix.season }}
          path: out
          retention-days: 30

  arms:
    needs: lineup
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        config: [pbp32_lp_cf, pbp32_lp_lu, pbp32_lp, pbp32_lp_noinj, pbp32, pbp32_noinj]
        season: [2021, 2022, 2023, 2024, 2025]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[wager]"
      - uses: actions/download-artifact@v4
        with: { name: nfl-data, path: data/nfl }
      - uses: actions/download-artifact@v4
        with:
          name: "fold${{ matrix.season }}"
          path: "runs/foundation/fold${{ matrix.season }}"
          run-id: ${{ env.FOUNDATION_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with: { name: "lineup${{ matrix.season }}", path: lineup }
      - name: Backtest ${{ matrix.config }} on ${{ matrix.season }}
        run: |
          cp lineup/lineup.parquet runs/foundation/fold${{ matrix.season }}/emb/
          python scripts/foundation_arm.py ${{ matrix.config }} ${{ matrix.season }} --threads $(nproc) \
            --experiment experiments/nfl/lineups.yaml --output-dir experiments/nfl/lineups
          mkdir -p out/${{ matrix.config }}
          cp experiments/nfl/lineups/${{ matrix.config }}/${{ matrix.season }}.csv out/${{ matrix.config }}/
      - uses: actions/upload-artifact@v4
        with:
          name: arm-${{ matrix.config }}-${{ matrix.season }}
          path: out
          retention-days: 30

  report:
    needs: arms
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[wager]"
      - uses: actions/download-artifact@v4
        with: { name: nfl-data, path: data/nfl }
      - uses: actions/download-artifact@v4
        with: { pattern: "arm-*", path: experiments/nfl/lineups, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { pattern: "lineup*", path: lineups }
      - name: Score
        run: |
          mkdir -p experiments/nfl/lineups/changes
          cp lineups/*/changes/*.csv experiments/nfl/lineups/changes/
          python - <<'EOF'
          import pathlib, yaml
          from runitback.wager.experiments import ablate
          cfg = yaml.safe_load(open("experiments/nfl/lineups.yaml"))
          have = {n: c for n, c in cfg["configs"].items()
                  if all(pathlib.Path(f"experiments/nfl/lineups/{n}/{s}.csv").exists() for s in cfg["seasons"])}
          print("complete configurations:", list(have))
          ablate("data/nfl/games.csv", "nfl", have, cfg["seasons"], "experiments/nfl/lineups", cfg["baseline"], 1, 1)
          EOF
          python scripts/foundation_report.py experiments/nfl/lineups --baseline pbp32 \
            --out experiments/nfl/lineups/report.md
          python scripts/lineup_report.py experiments/nfl/lineups --baseline pbp32 \
            --out experiments/nfl/lineups/subsets.md
          { echo "## Lineup experiment"; cat experiments/nfl/lineups/ablation.md; echo; \
            cat experiments/nfl/lineups/subsets.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/nfl/lineups
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "Lineup experiment results (run ${{ github.run_id }})"
          for i in 1 2 3 4; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
