# Everything the NHL generator experiments build on, rebuilt from the public sources in the calling
# run (nothing comes from the repository or from an earlier run), as nfl-experiment-inputs.yml does
# for the NFL. Called by the NHL experiment workflows:
#
#   data ─► foundation (one fold per season, then its simulation check)
#
# Artifacts, all in the calling run:
#   nhl-data     data/nhl/plays: every game of the sportsdataverse nhl_pbp_full release (2010-11 on)
#                replayed through the rules engine (plays, games, pre-game ratings), plus the
#                per-season replay summary (preprocess.json)
#   nhl-fold<S>  the NHL event generator that never sees season S (runitback nhl foundation):
#                model.pt, pca_32.npz and pbp_32.parquet (pooled over each team's own and its
#                opponent's events, PCA fit on games before S), history.json (validation loss per
#                epoch) and evaluate.json (simulated vs actual scores of games of S)     [foundation]
name: NHL experiment inputs

on:
  workflow_call:
    inputs:
      seasons:
        description: "Test seasons (JSON list, the year a season ends) for the folds"
        type: string
        default: "[2022, 2023, 2024, 2025, 2026]"
      start-season:
        description: "First season of play-by-play to download (2011 = 2010-11, the first with on-ice data)"
        type: string
        default: "2011"
      end-season:
        description: "Last season of play-by-play to download"
        type: string
        default: "2027"
      foundation:
        description: "Train the foundation folds"
        type: boolean
        default: true
      eval-games:
        description: "Games of the fold's test season to simulate in its check"
        type: string
        default: "300"
      eval-sims:
        description: "Simulations per game in the check"
        type: string
        default: "40"

permissions:
  contents: read

env:
  MLFLOW_DISABLE_AGENT_HINT: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
      # The generator needs the release's events only; the shift charts (personnel gaps) are
      # for the player-value packages
      - name: Play-by-play, schedule, players
        run: runitback nhl download --start ${{ inputs.start-season }} --end ${{ inputs.end-season }} --no-shifts
      - name: Replay every game through the rules engine
        run: |
          runitback nhl preprocess --start ${{ inputs.start-season }} --end ${{ inputs.end-season }} \
            --workers $(nproc) | tee preprocess.json
          mv preprocess.json data/nhl/plays/
          python -c "import pandas as pd; g = pd.read_parquet('data/nhl/plays/games.parquet'); \
            print(g.groupby('season').size().to_string())"
          ls -la data/nhl/plays
      - uses: actions/upload-artifact@v4
        with:
          name: nhl-data
          path: data/nhl/plays
          if-no-files-found: error
          retention-days: 7

  foundation:
    needs: data
    if: ${{ inputs.foundation }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        season: ${{ fromJSON(inputs.seasons) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
      - uses: actions/download-artifact@v4
        with: { name: nhl-data, path: data/nhl/plays }
      - name: Train fold ${{ matrix.season }} (never sees it) and embed every game (PCA on games before it)
        run: |
          S=${{ matrix.season }}
          # runitback.nhl.foundation.TRAIN: validated on the last 40% of S-1, trained on the games before
          runitback nhl foundation --root runs/foundation --season $S --data data/nhl/plays --threads $(nproc)
          ls -la runs/foundation/fold$S
      - name: Keep the validation history
        run: |
          S=${{ matrix.season }}
          python -c "import json, torch; ck = torch.load('runs/foundation/fold$S/model.pt', weights_only=False); \
            json.dump({'val_season': ck['val_season'], 'history': ck['history'], 'team_seasons': ck['team_seasons']}, \
            open('runs/foundation/fold$S/history.json', 'w'), indent=1)"
      - name: Simulate games of ${{ matrix.season }} against their actual scores
        run: |
          S=${{ matrix.season }}
          runitback nhl evaluate --ckpt runs/foundation/fold$S/model.pt --data data/nhl/plays --season $S \
            --games ${{ inputs.eval-games }} --sims ${{ inputs.eval-sims }} --threads $(nproc) \
            --out runs/foundation/fold$S/evaluate.json > /dev/null
          python -c "import json; r = json.load(open('runs/foundation/fold$S/evaluate.json')); \
            print(json.dumps({k: r[k] for k in ('val_nll', 'scores', 'prediction')}, indent=1))"
      - uses: actions/upload-artifact@v4
        with:
          name: nhl-fold${{ matrix.season }}
          path: runs/foundation/fold${{ matrix.season }}
          retention-days: 30
