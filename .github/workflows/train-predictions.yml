# Train the wager model (spread / moneyline / total), run its walk-forward backtest (the
# performance page, Beat the model, past power rankings) and publish the result as the
# `predictions-webdata` release asset that Refresh predictions exports from. Ported from
# sportsml's Train workflow. NFL, NBA, CFB and women's college basketball.
#
# The NFL model reads the play-by-play foundation's frozen game embeddings (experiments/nfl:
# pbp32): one foundation model per test season ("fold", runitback.nfl.foundation), kept in the
# `foundation-nfl` release. A season's fold is trained once, the first time it is needed (about
# 1-1.5 hours, at the start of each season); the 2021-2025 folds come from the foundation
# experiment's run the first time.
#
# It also reads player values (experiments/nfl: pbp32_pvc, 4 seeds): weekly, leak-free values of
# every player, summed over each team's projected lineup per position group (`runitback nfl
# player-values`, ~5 min), rebuilt here and in Refresh predictions (injury reports and depth
# charts change during the week).
#
# The NBA model (experiments/nba: prod_pvc_e4) reads player values only, no foundation folds:
# the `pbp32` arms did not pass the promotion bar. Its values (`runitback nba player-values`,
# from N1-N3) are rebuilt in the build job from the public sources; its backtest and model are
# cached like the NFL's.
#
# The CFB model (experiments/cfb: pbp32_qb, 4 seeds) reads both: college play-by-play folds
# (`runitback cfb foundation`, team-level, 54-97 minutes each on a 4-core runner, one matrix job per
# season, kept in the `foundation-cfb` release and keyed as the wager model keys teams by
# `runitback cfb wager-embeddings`) and starting-quarterback values (`runitback cfb player-values`).
# Its betting lines come from ESPN's odds API, one request per game (about 12,000 for every season
# since 2013), and ESPN refuses a runner after a burst of them: the `cfb-lines` matrix job fetches each
# season's in its own job, and the `cfb-espn-cache` release keeps the finished games' lines (and the
# finished seasons' schedules and box scores) for this workflow and Refresh predictions, which then
# only request the newest games.
#
# The women's college basketball model (experiments/wcbb: prod_pvc_e4, 4 seeds) reads player values only
# (`runitback college player-values --gender wcbb`: box-score values of every player, summed over each
# team's projected rotation; the rotations of upcoming games come from ESPN's rosters,
# `runitback college lineups --live`). The build job rebuilds them from sportsdataverse's box scores
# and ESPN, and trains with RUNITBACK_WCBB_PLAYER_VALUES set (runitback.wager.wcbb). Men's college
# basketball is not built here yet.
#
# Each sport is built in its own parallel job (`build-nfl`, `build-nba`, `build-cfb`, `build-wcbb`, each with its
# own runner and time limit) and `publish` lays what was built over the published web data: a sport
# whose build failed keeps its previous data, and the others are published.
#
# Runs monthly during the season and on demand, e.g. after changing the model. Backtest
# seasons are reused from the previous release, or from the `predictions-backtest-cache`
# release that every build adds its seasons and models to (here or on any machine:
# `runitback-wager web build --cache release:predictions-backtest-cache`), while the model
# and its code are unchanged; a routine run only trains the model for upcoming games
# (~15 min), a full backtest (after a model change, or with refresh_backtest) ~1 hour.
name: Train predictions

on:
  workflow_dispatch:
    inputs:
      refresh_backtest:
        description: Backtest every season again instead of reusing the last release's
        type: boolean
        default: false
      reuse_model_days:
        description: >-
          Use the backtest cache's model if trained at most this many days ago, instead of
          training (0: train)
        type: number
        default: 0
      max_new_seasons:
        description: >-
          How many seasons that no cache has to backtest (the latest ones), for each sport that has no
          input of its own below. Empty or "all": every one. A number: at most that many, and 0 builds
          the sport from its cached seasons alone (it needs at least one cached season). A season that does not finish before its job's limit
          is lost, so size each sport's value to its job's 350 minutes (the NBA takes ~190 min a
          season, CFB ~65 min plus ~50 min of setup)
        type: string
        default: ""
      max_new_seasons_nfl:
        description: "max_new_seasons for the NFL alone (empty: use max_new_seasons; all, or a number, 0 included)"
        type: string
        default: ""
      max_new_seasons_nba:
        description: "max_new_seasons for the NBA alone (empty: use max_new_seasons; all, or a number, 0 included)"
        type: string
        default: ""
      max_new_seasons_cfb:
        description: "max_new_seasons for college football alone (empty: use max_new_seasons; all, or a number, 0 included)"
        type: string
        default: ""
      max_new_seasons_wcbb:
        description: >-
          max_new_seasons for women's college basketball alone (empty: use max_new_seasons; all, or a number,
          0 included). Its first run has no cached season: start with 1 and repeat until the backtest cache
          has them all, as a 4-seed season's time is not yet measured here
        type: string
        default: "1"
  schedule:
    - cron: "41 7 1 * *" # the 1st of each month

permissions:
  contents: write # the predictions-webdata and backtest cache releases
  actions: write # start Refresh predictions

concurrency:
  group: train-predictions
  cancel-in-progress: false

jobs:
  # the play-by-play folds in their own job (a new season's fold trains for hours), published
  # before the wager model's build, so a build that fails or times out keeps them
  folds:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUNITBACK_NFL_FOUNDATION: foundation/nfl
      RUNITBACK_NFL_PLAYER_VALUES: player_values/nfl
      RUNITBACK_NBA_PLAYER_VALUES: player_values/nba
      # the Foundation experiment run whose fold artifacts seed the release (until they expire)
      FOUNDATION_SEED_RUN: "42286987708"
      MLFLOW_TRACKING_URI: sqlite:///${{ github.workspace }}/mlflow.db
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[data,wager]"
      - name: Play-by-play
        run: |
          end=$(python -c "import datetime as d; t=d.date.today(); print(t.year if t.month >= 9 else t.year - 1)")
          runitback nfl download --start 1999 --end "$end"
          runitback nfl preprocess --start 1999 --end "$end"
      - name: Fetch the foundation folds
        run: |
          mkdir -p "$RUNITBACK_NFL_FOUNDATION" folds
          for a in $(gh release view foundation-nfl --json assets -q '.assets[].name' 2>/dev/null); do
            gh release download foundation-nfl --pattern "$a" --dir folds
            mkdir -p "$RUNITBACK_NFL_FOUNDATION/${a%.tar.gz}"
            tar -xzf "folds/$a" -C "$RUNITBACK_NFL_FOUNDATION/${a%.tar.gz}"
          done
          for s in 2021 2022 2023 2024 2025; do
            d="$RUNITBACK_NFL_FOUNDATION/fold$s"
            [ -f "$d/model.pt" ] && continue
            if gh run download "$FOUNDATION_SEED_RUN" --name "fold$s" --dir "seed/fold$s"; then
              mkdir -p "$d" && cp seed/fold$s/model.pt seed/fold$s/emb/pca_32.npz seed/fold$s/emb/pbp_32.parquet "$d/"
              echo "fold$s: from the foundation experiment"
            fi
          done
      - name: Train missing folds, embed new games
        run: runitback nfl foundation --root "$RUNITBACK_NFL_FOUNDATION" --threads $(nproc)
      - name: Publish the folds
        # before the build, so a trained fold is kept even if the build fails
        run: |
          gh release view foundation-nfl >/dev/null 2>&1 || gh release create foundation-nfl \
            --title "NFL play-by-play foundation folds" --latest=false \
            --notes "One play-by-play model per test season, its PCA and game embeddings (runitback.nfl.foundation). Written by Train predictions."
          for d in "$RUNITBACK_NFL_FOUNDATION"/fold*; do
            tar -czf "folds/$(basename "$d").tar.gz" -C "$d" model.pt pca_32.npz pbp_32.parquet
          done
          gh release upload foundation-nfl folds/fold*.tar.gz --clobber
  # the college seasons this run works on (the NFL's `end` rule: a season is current from September)
  cfb-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      end: ${{ steps.plan.outputs.end }}
      folds: ${{ steps.plan.outputs.folds }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - id: plan
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, json
          t = datetime.date.today()
          end = t.year if t.month >= 9 else t.year - 1
          print(f"end={end}")
          # the backtest's last 5 seasons and the current one (runitback.core.foundation.default_seasons)
          print("folds=" + json.dumps(list(range(end - 5, end + 1))))
          # betting lines start in 2013; earlier seasons need no odds requests
          shards = [{"first": 2004, "last": 2012}] + [{"first": s, "last": s} for s in range(2013, end + 1)]
          print("shards=" + json.dumps(shards))
          PY
  # ESPN lines, a season per job (it refuses a runner after a burst of requests): each job starts from
  # the `cfb-espn-cache` release, so only games the cache lacks are requested
  cfb-lines:
    needs: cfb-plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.cfb-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[wager]"
      - name: Fetch the cached lines
        run: |
          source scripts/ci/release.sh
          mkdir -p data/cfb/espn_cache
          assets=$(release_assets cfb-espn-cache)
          if grep -qx cfb-espn-cache.tar.gz <<<"$assets"; then
            fetch_asset cfb-espn-cache cfb-espn-cache.tar.gz dl/cfb
            tar -xzf dl/cfb/cfb-espn-cache.tar.gz -C data/cfb/espn_cache
          fi
      - name: Download seasons ${{ matrix.shard.first }}-${{ matrix.shard.last }}
        run: >
          runitback-wager cfb download --first_season ${{ matrix.shard.first }}
          --last_season ${{ matrix.shard.last }} --cache_dir data/cfb/espn_cache
          --output_file shard.csv
      - name: Keep this shard's files
        run: |
          mkdir shard
          for s in $(seq ${{ matrix.shard.first }} ${{ matrix.shard.last }}); do
            cp data/cfb/espn_cache/*_$s.* shard/ 2>/dev/null || true
          done
          ls -la shard
      - uses: actions/upload-artifact@v4
        with:
          name: cfb-lines-${{ matrix.shard.first }}
          path: shard
          retention-days: 1
          if-no-files-found: error
  # The lines the shards fetched, kept for the next run and for Refresh predictions. Its own job, so
  # the lines of the shards that succeeded are kept when another shard, a fold or the build fails;
  # it lays them over the cache so far, so a failed shard never removes anything.
  cfb-lines-cache:
    needs: [cfb-plan, cfb-lines]
    if: ${{ !cancelled() && needs.cfb-plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - name: Fetch the cache so far
        run: |
          source scripts/ci/release.sh
          mkdir -p data/cfb/espn_cache
          assets=$(release_assets cfb-espn-cache)
          if grep -qx cfb-espn-cache.tar.gz <<<"$assets"; then
            fetch_asset cfb-espn-cache cfb-espn-cache.tar.gz dl/cfb
            tar -xzf dl/cfb/cfb-espn-cache.tar.gz -C data/cfb/espn_cache
          fi
      - uses: actions/download-artifact@v4
        # no artifact when every shard failed
        continue-on-error: true
        with: { pattern: "cfb-lines-*", path: data/cfb/espn_cache, merge-multiple: true }
      - name: Publish the cache
        # only finished seasons' files and finished games' lines are in it
        run: |
          if [ -z "$(ls -A data/cfb/espn_cache)" ]; then echo "nothing to publish"; exit 0; fi
          tar -czf cfb-espn-cache.tar.gz -C data/cfb/espn_cache .
          gh release view cfb-espn-cache >/dev/null 2>&1 || gh release create cfb-espn-cache \
            --title "CFB lines cache (ESPN odds, schedules, box scores)" --latest=false \
            --notes "Finished games' lines and finished seasons' files, so a download only requests new games. Written by Train predictions; Refresh predictions reads it." \
            || gh release view cfb-espn-cache >/dev/null
          gh release upload cfb-espn-cache cfb-espn-cache.tar.gz --clobber
  # college play-by-play, quarterback plays and values: the folds' and the build's inputs
  cfb-data:
    needs: cfb-plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      END: ${{ needs.cfb-plan.outputs.end }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[data,wager]"
      - name: Play-by-play, schedules, box scores; engine replay; quarterback plays
        run: |
          runitback cfb download --start 2004 --end "$END"
          runitback cfb preprocess --start 2004 --end "$END"
          runitback cfb players --start 2012 --end "$END"
      - name: Quarterback values
        run: runitback cfb player-values --start 2012 --end "$END" --jobs $(nproc) --out player_values/cfb
      - uses: actions/upload-artifact@v4
        with: { name: cfb-processed, path: data/cfb/processed, retention-days: 1 }
      - uses: actions/upload-artifact@v4
        with: { name: cfb-schedule, path: "data/cfb/raw/schedule_*.parquet", retention-days: 1 }
      - uses: actions/upload-artifact@v4
        with: { name: cfb-playervalues, path: player_values/cfb, retention-days: 1 }
  # one fold per job (a new season's fold trains for 1-1.5 hours), published before the build so a
  # build that fails or times out keeps them
  cfb-folds:
    needs: [cfb-plan, cfb-data]
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      END: ${{ needs.cfb-plan.outputs.end }}
      FOLDS: foundation/cfb
      MLFLOW_TRACKING_URI: sqlite:///${{ github.workspace }}/mlflow.db
      MLFLOW_DISABLE_AGENT_HINT: "1"
    strategy:
      fail-fast: false
      matrix:
        season: ${{ fromJSON(needs.cfb-plan.outputs.folds) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[wager]"
      - uses: actions/download-artifact@v4
        with: { name: cfb-processed, path: data/cfb/processed }
      - uses: actions/download-artifact@v4
        with: { name: cfb-schedule, path: data/cfb/raw }
      - name: Fetch the fold
        # a gh failure fails the step: it must not look like "no fold yet", which retrains one
        # (40-97 min) and replaces the published fold, so every cached backtest season misses
        run: |
          source scripts/ci/release.sh
          assets=$(release_assets foundation-cfb)
          if grep -qx "fold${{ matrix.season }}.tar.gz" <<<"$assets"; then
            fetch_folds cfb "$FOLDS" ${{ matrix.season }}
          else
            echo "no fold${{ matrix.season }} yet: training it"
          fi
      - name: Train the fold if it has no model, embed the games played since, key it for the wager model
        run: |
          runitback cfb foundation --root "$FOLDS" --season ${{ matrix.season }} --data data/cfb/processed --threads $(nproc)
          runitback cfb wager-embeddings --root "$FOLDS" --season ${{ matrix.season }} --end "$END"
          ls -la "$FOLDS/fold${{ matrix.season }}"
      - name: Publish the fold
        run: |
          mkdir -p folds
          gh release view foundation-cfb >/dev/null 2>&1 || gh release create foundation-cfb \
            --title "CFB play-by-play foundation folds" --latest=false \
            --notes "One college play-by-play model per test season, its PCA and game embeddings (runitback.cfb.foundation). Written by Train predictions." \
            || gh release view foundation-cfb >/dev/null
          tar -czf "folds/fold${{ matrix.season }}.tar.gz" -C "$FOLDS/fold${{ matrix.season }}" \
            model.pt pca_32.npz pbp_32.parquet pbp_32_wager.parquet
          gh release upload foundation-cfb "folds/fold${{ matrix.season }}.tar.gz" --clobber
  # One build job per sport, in parallel: each gets its own runner and its own time limit (a sport's
  # backtest runs its seasons one after another, and the NBA's alone takes ~75 min a season), and one
  # sport failing leaves the others' results to be published. Each uploads its `webdata/<sport>/`.
  build-nfl:
    needs: folds
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUNITBACK_NFL_FOUNDATION: foundation/nfl
      RUNITBACK_NFL_PLAYER_VALUES: player_values/nfl
      MLFLOW_TRACKING_URI: sqlite:///${{ github.workspace }}/mlflow.db
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[data,wager]"
      - name: Play-by-play
        run: |
          end=$(python -c "import datetime as d; t=d.date.today(); print(t.year if t.month >= 9 else t.year - 1)")
          runitback nfl download --start 1999 --end "$end"
          runitback nfl preprocess --start 1999 --end "$end"
      - name: Fetch the foundation folds
        run: |
          mkdir -p "$RUNITBACK_NFL_FOUNDATION" folds
          for a in $(gh release view foundation-nfl --json assets -q '.assets[].name'); do
            gh release download foundation-nfl --pattern "$a" --dir folds
            mkdir -p "$RUNITBACK_NFL_FOUNDATION/${a%.tar.gz}"
            tar -xzf "folds/$a" -C "$RUNITBACK_NFL_FOUNDATION/${a%.tar.gz}"
          done
      - name: Player values
        run: runitback nfl player-values --out "$RUNITBACK_NFL_PLAYER_VALUES"
      - name: Fetch the previous build (its backtest seasons can be reused)
        run: |
          mkdir webdata
          if gh release download predictions-webdata --pattern webdata.tar.gz; then
            tar -xzf webdata.tar.gz -C webdata && rm webdata.tar.gz
          else
            echo "no previous predictions-webdata release: backtesting every season"
          fi
      - name: Download, train, backtest
        env:
          SPORT_MAX: ${{ inputs.max_new_seasons_nfl }}
          SHARED_MAX: ${{ inputs.max_new_seasons }}
        run: |
          # this sport's input, else the shared one; empty or "all": every season, 0: none
          MAX_NEW_SEASONS=${SPORT_MAX:-$SHARED_MAX}
          max=()
          case "$MAX_NEW_SEASONS" in
            ""|all) ;;
            *[!0-9]*) echo "::error::max_new_seasons must be a whole number or all, got '$MAX_NEW_SEASONS'"; exit 1 ;;
            *) max=(--max_new_seasons "$MAX_NEW_SEASONS") ;;
          esac
          runitback-wager web build --sports '[nfl]' --output_dir webdata \
            --cache release:predictions-backtest-cache \
            --refresh_backtest ${{ inputs.refresh_backtest || false }} \
            --reuse_model_days ${{ inputs.reuse_model_days || 0 }} \
            "${max[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: webdata-nfl
          path: webdata/nfl
          retention-days: 1
          if-no-files-found: error
  build-nba:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUNITBACK_NBA_PLAYER_VALUES: player_values/nba
      MLFLOW_TRACKING_URI: sqlite:///${{ github.workspace }}/mlflow.db
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[data,wager]"
      - name: NBA player values (rotations from rosters and the injury report)
        run: |
          runitback nba download --start 2015 --end 2027
          runitback nba players --start 2015 --end 2027
          runitback nba lineups --live
          runitback nba player-values --start 2015 --end 2027 --out "$RUNITBACK_NBA_PLAYER_VALUES" \
            --lineups data/nba/processed/projected_lineups.parquet \
            --upcoming data/nba/processed/projected_lineups_upcoming.parquet
      - name: Fetch the previous build (its backtest seasons can be reused)
        run: |
          mkdir webdata
          if gh release download predictions-webdata --pattern webdata.tar.gz; then
            tar -xzf webdata.tar.gz -C webdata && rm webdata.tar.gz
          else
            echo "no previous predictions-webdata release: backtesting every season"
          fi
      - name: Download, train, backtest
        env:
          SPORT_MAX: ${{ inputs.max_new_seasons_nba }}
          SHARED_MAX: ${{ inputs.max_new_seasons }}
        run: |
          # this sport's input, else the shared one; empty or "all": every season, 0: none
          MAX_NEW_SEASONS=${SPORT_MAX:-$SHARED_MAX}
          max=()
          case "$MAX_NEW_SEASONS" in
            ""|all) ;;
            *[!0-9]*) echo "::error::max_new_seasons must be a whole number or all, got '$MAX_NEW_SEASONS'"; exit 1 ;;
            *) max=(--max_new_seasons "$MAX_NEW_SEASONS") ;;
          esac
          runitback-wager web build --sports '[nba]' --output_dir webdata \
            --cache release:predictions-backtest-cache \
            --refresh_backtest ${{ inputs.refresh_backtest || false }} \
            --reuse_model_days ${{ inputs.reuse_model_days || 0 }} \
            "${max[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: webdata-nba
          path: webdata/nba
          retention-days: 1
          if-no-files-found: error
  # Needs every college job: without all of its inputs CFB is not built, and its published data stays
  # (the NFL and NBA are built and published either way).
  build-cfb:
    needs: [cfb-plan, cfb-data, cfb-folds, cfb-lines, cfb-lines-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CFB_FOLDS: ${{ needs.cfb-plan.outputs.folds }}
      # the CFB model is pbp32_qb when both are set (runitback.wager.cfb)
      RUNITBACK_CFB_FOUNDATION: foundation/cfb
      RUNITBACK_CFB_PLAYER_VALUES: player_values/cfb
      MLFLOW_TRACKING_URI: sqlite:///${{ github.workspace }}/mlflow.db
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[data,wager]"
      - name: CFB foundation folds
        # every season the plan lists must be there, keyed for the wager model (pbp_32_wager.parquet)
        run: |
          source scripts/ci/release.sh
          fetch_folds cfb "$RUNITBACK_CFB_FOUNDATION" $(jq -r '.[]' <<<"$CFB_FOLDS")
          ls "$RUNITBACK_CFB_FOUNDATION"
      - uses: actions/download-artifact@v4
        with: { name: cfb-playervalues, path: player_values/cfb }
      - name: CFB lines cache
        # published by cfb-lines-cache: the finished games' lines, so the build only requests new ones
        run: |
          source scripts/ci/release.sh
          mkdir -p data/cfb/espn_cache
          fetch_asset cfb-espn-cache cfb-espn-cache.tar.gz dl/cfb
          tar -xzf dl/cfb/cfb-espn-cache.tar.gz -C data/cfb/espn_cache
      - name: Fetch the previous build (its backtest seasons can be reused)
        run: |
          mkdir webdata
          if gh release download predictions-webdata --pattern webdata.tar.gz; then
            tar -xzf webdata.tar.gz -C webdata && rm webdata.tar.gz
          else
            echo "no previous predictions-webdata release: backtesting every season"
          fi
      - name: Download, train, backtest
        env:
          SPORT_MAX: ${{ inputs.max_new_seasons_cfb }}
          SHARED_MAX: ${{ inputs.max_new_seasons }}
        run: |
          # this sport's input, else the shared one; empty or "all": every season, 0: none
          MAX_NEW_SEASONS=${SPORT_MAX:-$SHARED_MAX}
          max=()
          case "$MAX_NEW_SEASONS" in
            ""|all) ;;
            *[!0-9]*) echo "::error::max_new_seasons must be a whole number or all, got '$MAX_NEW_SEASONS'"; exit 1 ;;
            *) max=(--max_new_seasons "$MAX_NEW_SEASONS") ;;
          esac
          runitback-wager web build --sports '[cfb]' --output_dir webdata \
            --cache release:predictions-backtest-cache \
            --refresh_backtest ${{ inputs.refresh_backtest || false }} \
            --reuse_model_days ${{ inputs.reuse_model_days || 0 }} \
            "${max[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: webdata-cfb
          path: webdata/cfb
          retention-days: 1
          if-no-files-found: error
  build-wcbb:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUNITBACK_WCBB_PLAYER_VALUES: player_values/wcbb
      MLFLOW_TRACKING_URI: sqlite:///${{ github.workspace }}/mlflow.db
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[data,wager]"
      - name: Women's college player values (rotations from rosters for upcoming games)
        run: |
          runitback college download --gender wcbb
          runitback college players --gender wcbb
          runitback college lineups --gender wcbb --live --days 3
          runitback college player-values --gender wcbb --out "$RUNITBACK_WCBB_PLAYER_VALUES"
      - name: Fetch the previous build (its backtest seasons can be reused)
        run: |
          mkdir webdata
          if gh release download predictions-webdata --pattern webdata.tar.gz; then
            tar -xzf webdata.tar.gz -C webdata && rm webdata.tar.gz
          else
            echo "no previous predictions-webdata release: backtesting every season"
          fi
      - name: Download, train, backtest
        env:
          SPORT_MAX: ${{ inputs.max_new_seasons_wcbb }}
          SHARED_MAX: ${{ inputs.max_new_seasons }}
        run: |
          # this sport's input, else the shared one; empty or "all": every season, 0: none
          MAX_NEW_SEASONS=${SPORT_MAX:-$SHARED_MAX}
          max=()
          case "$MAX_NEW_SEASONS" in
            ""|all) ;;
            *[!0-9]*) echo "::error::max_new_seasons must be a whole number or all, got '$MAX_NEW_SEASONS'"; exit 1 ;;
            *) max=(--max_new_seasons "$MAX_NEW_SEASONS") ;;
          esac
          runitback-wager web build --sports '[wcbb]' --output_dir webdata \
            --cache release:predictions-backtest-cache \
            --refresh_backtest ${{ inputs.refresh_backtest || false }} \
            --reuse_model_days ${{ inputs.reuse_model_days || 0 }} \
            "${max[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: webdata-wcbb
          path: webdata/wcbb
          retention-days: 1
          if-no-files-found: error
  # Lays the sports built in this run over the published web data, so a sport that failed (or was
  # not built) keeps what it had, and publishes it.
  publish:
    needs: [build-nfl, build-nba, build-cfb, build-wcbb]
    if: ${{ !cancelled() && (needs.build-nfl.result == 'success' || needs.build-nba.result == 'success' || needs.build-cfb.result == 'success' || needs.build-wcbb.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Fetch the published web data
        run: |
          mkdir webdata
          if gh release download predictions-webdata --pattern webdata.tar.gz; then
            tar -xzf webdata.tar.gz -C webdata && rm webdata.tar.gz
          else
            echo "no previous predictions-webdata release"
          fi
      - uses: actions/download-artifact@v4
        with: { pattern: "webdata-*", path: parts }
      - name: Add the sports built in this run
        run: |
          for d in parts/webdata-*; do
            sport=${d#parts/webdata-}
            rm -rf "webdata/$sport"
            mkdir -p "webdata/$sport"
            cp -a "$d/." "webdata/$sport/"
            echo "built $sport"
          done
          echo "NFL: ${{ needs.build-nfl.result }}, NBA: ${{ needs.build-nba.result }}, CFB: ${{ needs.build-cfb.result }}, WCBB: ${{ needs.build-wcbb.result }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish the predictions-webdata release asset
        run: |
          tar -czf webdata.tar.gz -C webdata .
          gh release view predictions-webdata >/dev/null 2>&1 || gh release create predictions-webdata \
            --title "Predictions web data (trained wager model and backtest)" --latest=false \
            --notes "Written by the Train predictions workflow; Refresh predictions exports from it."
          gh release upload predictions-webdata webdata.tar.gz --clobber
      - name: Refresh the published predictions
        # Refresh waits for this exact asset: a download right after the upload can still be
        # served the previous one
        run: >
          gh workflow run refresh-predictions.yml --ref "${{ github.ref_name }}"
          -f webdata_sha256="$(sha256sum webdata.tar.gz | cut -d' ' -f1)"
