# The QB-swap check (scripts/lineup_qb_swap.py): do the foundation model's player embeddings carry
# who plays? Rolls out 120 games of 2025 with named QBs in the home QB1 slot, in shards, on the
# foundation run's fold2025 model and the lineup run's processed data; commits the shards'
# results (experiments/nfl/lineups/qb_swap.<shard>.csv) to the branch it ran on.
name: QB swap

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [.github/workflows/qb-swap.yml]

permissions:
  contents: write
  actions: read

concurrency:
  group: qb-swap-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  FOUNDATION_RUN: "42286987708"
  DATA_RUN: "42333696576"
  SHARDS: 8

jobs:
  swap:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[wager]"
      - uses: actions/download-artifact@v4
        with:
          name: nfl-data
          path: data/nfl
          run-id: ${{ env.DATA_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: fold2025
          path: fold2025
          run-id: ${{ env.FOUNDATION_RUN }}
          github-token: ${{ github.token }}
      - name: Swap (shard ${{ matrix.shard }})
        run: |
          python scripts/lineup_qb_swap.py --ckpt fold2025/model.pt --season 2025 --games 120 \
            --sims 100 --threads $(nproc) --shard ${{ matrix.shard }} --shards $SHARDS --out out/qb_swap.csv
      - uses: actions/upload-artifact@v4
        with: { name: "qb-swap-${{ matrix.shard }}", path: out, retention-days: 30 }

  report:
    needs: swap
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - run: pip install pandas numpy torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - uses: actions/download-artifact@v4
        with: { pattern: "qb-swap-*", path: experiments/nfl/lineups, merge-multiple: true }
      - name: Summarize and commit
        run: |
          python scripts/lineup_qb_swap.py --summary experiments/nfl/lineups/qb_swap.*.csv | tee -a "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/nfl/lineups/qb_swap.*.csv
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "QB-swap results (run ${{ github.run_id }})"
          for i in 1 2 3 4; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
