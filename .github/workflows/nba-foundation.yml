# N4 (docs/multisport/PLAN.md): the NBA foundation folds (pbp32), one event generator per test
# season, each in its own job:
#
#   inputs (data, foundation: 5 backtest seasons + the current one) ─► report
#
# Data and the folds are rebuilt in the run (nba-experiment-inputs.yml). Fold S's generator is
# trained on games before the last 40% of season S-1 (validated on that 40%) and never sees S; its
# per-possession game embeddings are projected with a PCA fit on games before S. The report job
# checks those rules for every fold and summarizes validation loss, explained variance and a
# team-strength sanity check (scripts/nba_foundation_report.py), uploaded as the
# nba-foundation-results artifact; the folds are kept as nba-foundation-models.
#
# Runs when this file or nba-experiment-inputs.yml changes on a claude/ branch, or by hand.
name: NBA foundation

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - .github/workflows/nba-foundation.yml
      - .github/workflows/nba-experiment-inputs.yml

permissions:
  contents: read

concurrency:
  group: nba-foundation-${{ github.ref }}
  cancel-in-progress: true

env:
  MLFLOW_DISABLE_AGENT_HINT: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  inputs:
    uses: ./.github/workflows/nba-experiment-inputs.yml
    with:
      seasons: "[2022, 2023, 2024, 2025, 2026, 2027]"

  report:
    needs: inputs
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
      - uses: actions/download-artifact@v4
        with: { name: nba-data, path: data/nba }
      - uses: actions/download-artifact@v4
        with: { pattern: "nba-fold*", path: folds }
      - name: Report
        run: |
          mkdir -p runs/foundation out
          for d in folds/nba-fold*; do mv "$d" "runs/foundation/${d#folds/nba-}"; done
          ls runs/foundation
          python scripts/nba_foundation_report.py runs/foundation --data data/nba/processed \
            --out out/report.md --json out/report.json
          cat out/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: nba-foundation-results, path: out, retention-days: 90 }
      - uses: actions/upload-artifact@v4
        with: { name: nba-foundation-models, path: runs/foundation, retention-days: 90 }
