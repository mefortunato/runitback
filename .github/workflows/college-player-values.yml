# College basketball player values and projected rotations (work package C3), rebuilt from the public
# sources in the calling run, as nba-experiment-inputs.yml does for the NBA. For the C4 experiments
# to call (or run it by hand from the Actions tab); it has no push trigger.
#
# Artifact, in the calling run:
#   <gender>-player-values   data/<gender>/processed (player_games, team_games, players,
#                            projected_lineups) and player_values/<gender> (pv.parquet, ppg.json,
#                            values_latest.csv)
#
# Men's adjusted plus-minus uses the on-floor lineups rebuilt from ESPN's substitution events in
# sportsdataverse's play-by-play (2025 on), downloaded in the same run. No API key is needed.
name: College player values

on:
  workflow_dispatch:
    inputs:
      gender:
        description: "cbb (men's) or wcbb (women's)"
        type: choice
        options: [cbb, wcbb]
        default: cbb
  workflow_call:
    inputs:
      gender:
        type: string
        default: cbb

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  values:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[data,wager]"
      - name: Player box scores (and men's play-by-play), player tables and projected rotations
        run: |
          G=${{ inputs.gender }}
          runitback college download --gender $G
          runitback college players --gender $G
          runitback college lineups --gender $G
      - name: Weekly values and pv.parquet (men's - the ESPN lineup check is printed first)
        run: |
          G=${{ inputs.gender }}
          runitback college player-values --gender $G
          python scripts/college_player_values.py report --gender $G | tee player_values/$G/report.md
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.gender }}-player-values
          path: |
            data/${{ inputs.gender }}/processed
            player_values/${{ inputs.gender }}
          if-no-files-found: error
          retention-days: 30
