# Foundations with additive per-player effects for all 22 on the field (experiments/nfl/allpositions.yaml):
# every player's embedding moves his plays' result and yards through his own additive term, at every
# position. Production's settings plus the passer / carrier targets, player effects and:
#   ae   --all-effects --lineup-weight 1  (plus the lineup-only target: an adjusted plus-minus)
#   ae0  --all-effects                    (effects trained by the play loss alone)
# This workflow trains the folds (artifacts <variant>-fold<season>, with game embeddings and lineup
# features); allpositions-eval.yml runs the position swaps, player values and wager arms on them.
name: All-positions training

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - .github/workflows/allpositions-train.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: allpositions-train-${{ github.ref }}
  cancel-in-progress: true

env:
  MLFLOW_DISABLE_AGENT_HINT: "1"
  PYTHONUNBUFFERED: "1"
  DATA_RUN: "42333696576"

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        variant: [ae, ae0]
        season: [2021, 2022, 2023, 2024, 2025]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[data,wager]"
      - uses: actions/download-artifact@v4
        with: { name: nfl-data, path: data/nfl, run-id: "${{ env.DATA_RUN }}", github-token: "${{ github.token }}" }
      - name: Train (${{ matrix.variant }}, never sees ${{ matrix.season }})
        run: |
          S=${{ matrix.season }}
          if [ "${{ matrix.variant }}" = ae ]; then   # with the lineup-only target
            EXTRA="--lineup-weight 1"
          else                                        # effects trained by the play loss alone
            EXTRA=""
          fi
          runitback nfl train --out runs/${{ matrix.variant }}/fold$S --val-season $((S-1)) --val-week 15 \
            --epochs 10 --who --prev-lineup-prob 0.3 --qb-weight 1 --carrier-weight 1 --player-effects --all-effects \
            $EXTRA --threads $(nproc)
      - name: Game embeddings and lineup features
        run: |
          S=${{ matrix.season }}; D=runs/${{ matrix.variant }}/fold$S
          runitback nfl embed --ckpt $D/model.pt --out $D/emb --before-season $S --dim 32
          mkdir -p data/nfl/raw
          runitback nfl lineup-features --ckpt $D/model.pt --out $D/emb --fold $S --sets lu --threads $(nproc)
          rm -rf $D/train
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-fold${{ matrix.season }}
          path: runs/${{ matrix.variant }}/fold${{ matrix.season }}
          retention-days: 30
