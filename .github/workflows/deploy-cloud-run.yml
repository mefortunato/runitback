name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
      CLOUD_RUN_REGION: ${{ vars.CLOUD_RUN_REGION }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: |
          missing=""
          [ -n "$GOOGLE_CLOUD_PROJECT" ] || missing="$missing GOOGLE_CLOUD_PROJECT"
          [ -n "$CLOUD_RUN_REGION" ] || missing="$missing CLOUD_RUN_REGION"
          [ -n "$CLOUD_RUN_SERVICE" ] || missing="$missing CLOUD_RUN_SERVICE"
          [ -n "$GAR_REPOSITORY" ] || missing="$missing GAR_REPOSITORY"
          [ -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" ] || missing="$missing GCP_WORKLOAD_IDENTITY_PROVIDER"
          [ -n "$GCP_DEPLOY_SERVICE_ACCOUNT" ] || missing="$missing GCP_DEPLOY_SERVICE_ACCOUNT"
          if [ -n "$missing" ]; then
            printf 'Missing GitHub Actions variable or secret:%s\n' "$missing" >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${CLOUD_RUN_REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        env:
          IMAGE: ${{ vars.CLOUD_RUN_REGION }}-docker.pkg.dev/${{ vars.GOOGLE_CLOUD_PROJECT }}/${{ vars.GAR_REPOSITORY }}/runitback:${{ github.sha }}
        run: |
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ vars.CLOUD_RUN_REGION }}-docker.pkg.dev/${{ vars.GOOGLE_CLOUD_PROJECT }}/${{ vars.GAR_REPOSITORY }}/runitback:${{ github.sha }}
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --image "$IMAGE" \
            --project "$GOOGLE_CLOUD_PROJECT" \
            --region "$CLOUD_RUN_REGION" \
            --max 1 \
            --quiet
