name: Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Deployment settings are secrets on the "production" GitHub environment
    # (Settings -> Environments -> production). Running the job in that
    # environment exposes them and applies its protection rules.
    environment: production
    env:
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
      CLOUD_RUN_REGION: ${{ secrets.CLOUD_RUN_REGION }}
      CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
      GAR_REPOSITORY: ${{ secrets.GAR_REPOSITORY }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate deployment configuration
        run: |
          missing=""
          [ -n "$GOOGLE_CLOUD_PROJECT" ] || missing="$missing GOOGLE_CLOUD_PROJECT"
          [ -n "$CLOUD_RUN_REGION" ] || missing="$missing CLOUD_RUN_REGION"
          [ -n "$CLOUD_RUN_SERVICE" ] || missing="$missing CLOUD_RUN_SERVICE"
          [ -n "$GAR_REPOSITORY" ] || missing="$missing GAR_REPOSITORY"
          [ -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" ] || missing="$missing GCP_WORKLOAD_IDENTITY_PROVIDER"
          [ -n "$GCP_DEPLOY_SERVICE_ACCOUNT" ] || missing="$missing GCP_DEPLOY_SERVICE_ACCOUNT"
          if [ -n "$missing" ]; then
            printf 'Missing secret(s) in the production environment:%s\n' "$missing" >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CLOUD_RUN_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push image
        env:
          IMAGE: ${{ env.CLOUD_RUN_REGION }}-docker.pkg.dev/${{ env.GOOGLE_CLOUD_PROJECT }}/${{ env.GAR_REPOSITORY }}/runitback:${{ github.sha }}
        run: |
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        env:
          IMAGE: ${{ env.CLOUD_RUN_REGION }}-docker.pkg.dev/${{ env.GOOGLE_CLOUD_PROJECT }}/${{ env.GAR_REPOSITORY }}/runitback:${{ github.sha }}
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --image "$IMAGE" \
            --project "$GOOGLE_CLOUD_PROJECT" \
            --region "$CLOUD_RUN_REGION" \
            --max 1 \
            --quiet
