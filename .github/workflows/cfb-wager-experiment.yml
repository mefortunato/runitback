# F3 (docs/multisport/PLAN.md): the college football wager model on the foundation (pbp32) and the
# starting-quarterback values (qb), walk-forward over 2021-2025 (experiments/cfb/wager.yaml):
#
#   shards (ESPN odds, one per season) ─► games ──────────────────────────────┐
#   data (play-by-play, QB plays, weekly QB values) ─► folds (one per season) ─┴─► arms ─► report
#                                                    └─► swap (2025: the home QB changed)
#
# Every input is rebuilt from the public sources in this run (sportsdataverse's espn_cfb_pbp,
# espn_cfb_player_box and cfb_schedules; ESPN's odds API); nothing comes from the repository or an
# earlier run. Fold S trains on games before season S-1 week 10, so it never sees S; its PCA is fit
# on games before S, and its embeddings are keyed as the wager model keys teams (school names, FCS
# pooled). The report scores every arm against prod (1 seed) and the 4-seed ensembles against each
# other, on all games and on the games where the starting QB moved, and adds the swap test; it is
# uploaded as the cfb-wager-results artifact. Nothing is committed.
#
# ESPN refuses a runner after a burst of odds requests, so each season's lines are fetched by its own
# job; if one is refused, "Re-run failed jobs".
#
# Runs when this file or experiments/cfb/wager.yaml changes on a claude/ branch, or by hand.
name: CFB wager experiment

on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - .github/workflows/cfb-wager-experiment.yml
      - experiments/cfb/wager.yaml

permissions:
  contents: read

concurrency:
  group: cfb-wager-experiment-${{ github.ref }}
  cancel-in-progress: true

env:
  MLFLOW_DISABLE_AGENT_HINT: "1"
  PYTHONUNBUFFERED: "1"
  LAST_SEASON: "2025"

jobs:
  shards:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # betting lines start in 2013; earlier seasons need no odds requests
        seasons: ["2004-2012", "2013", "2014", "2015", "2016", "2017", "2018", "2019", "2020",
                  "2021", "2022", "2023", "2024", "2025"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[wager]"
      - name: Download ${{ matrix.seasons }}
        run: |
          range="${{ matrix.seasons }}"
          runitback-wager cfb download --first_season "${range%-*}" --last_season "${range#*-}" \
            --cache_dir data/cfb/espn_cache --output_file shard.csv
      - uses: actions/upload-artifact@v4
        with:
          name: cfb-cache-${{ matrix.seasons }}
          path: data/cfb/espn_cache
          retention-days: 7

  games:
    needs: shards
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[wager]"
      - uses: actions/download-artifact@v4
        with: { pattern: "cfb-cache-*", path: data/cfb/espn_cache, merge-multiple: true }
      - name: Games with lines (every finished season is in the merged cache)
        run: |
          runitback-wager cfb download --last_season $LAST_SEASON --cache_dir data/cfb/espn_cache \
            --output_file data/cfb/raw.csv
          runitback-wager cfb process --games data/cfb/raw.csv --output_file data/cfb/games.csv
          ls -la data/cfb
      - uses: actions/upload-artifact@v4
        with: { name: cfb-games, path: data/cfb/games.csv, retention-days: 7 }

  data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[data,wager]"
      - name: Play-by-play, schedules and player box scores; engine replay; quarterback plays
        run: |
          runitback cfb download --start 2004 --end $LAST_SEASON
          runitback cfb preprocess --start 2004 --end $LAST_SEASON
          runitback cfb players --start 2012 --end $LAST_SEASON
          ls -la data/cfb/processed
      - name: Weekly quarterback values and each team-game's projected-starter terms (pv.parquet)
        run: |
          runitback cfb player-values --start 2012 --end $LAST_SEASON --jobs $(nproc) --out player_values/cfb
          python - <<'PY'
          import pandas as pd
          pv = pd.read_parquet("player_values/cfb/pv.parquet")
          st = pd.read_parquet("player_values/cfb/starters.parquet")
          print(len(pv), "team-games;", pv.game_id.nunique(), "games")
          print(pv.describe().T[["mean", "std", "min", "max"]].round(2).to_string())
          ok = st.dropna(subset=["starter"])
          print(f"projected starter right in {(ok.projected == ok.starter).mean():.1%} of {len(ok)} team-games")
          PY
          mkdir -p swapdata/processed swapdata/raw
          cp data/cfb/processed/{qb_plays,team_games,players}.parquet swapdata/processed/
          cp data/cfb/raw/schedule_*.parquet swapdata/raw/
      - name: Engine replay summary
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          s = json.load(open("data/cfb/processed/replay.json"))
          print("## College engine replay")
          print(f"- games kept: {s['kept']} of {s['games']}; regulation transitions agree "
                f"{s['agreement']:.4f}; final score reached {s['final_agreement']:.4f}")
          EOF
      - uses: actions/upload-artifact@v4
        with: { name: cfb-processed, path: data/cfb/processed, retention-days: 7 }
      - uses: actions/upload-artifact@v4
        with: { name: cfb-schedule, path: swapdata/raw, retention-days: 7 }
      - uses: actions/upload-artifact@v4
        with: { name: cfb-playervalues, path: player_values/cfb, retention-days: 30 }
      - uses: actions/upload-artifact@v4
        with: { name: cfb-swapdata, path: swapdata/processed, retention-days: 7 }

  folds:
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        season: [2021, 2022, 2023, 2024, 2025]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[wager]"
      - uses: actions/download-artifact@v4
        with: { name: cfb-processed, path: data/cfb/processed }
      - uses: actions/download-artifact@v4
        with: { name: cfb-schedule, path: data/cfb/raw }
      - name: Train fold ${{ matrix.season }} (never sees it) and embed every game (PCA on games before it)
        run: |
          runitback cfb foundation --root runs/foundation/cfb --season ${{ matrix.season }} --threads $(nproc)
          runitback cfb wager-embeddings --root runs/foundation/cfb --season ${{ matrix.season }} --end $LAST_SEASON
          ls -la runs/foundation/cfb/fold${{ matrix.season }}
      - uses: actions/upload-artifact@v4
        with:
          name: cfb-fold${{ matrix.season }}
          path: runs/foundation/cfb/fold${{ matrix.season }}
          retention-days: 30

  arms:
    needs: [games, data, folds]
    runs-on: ubuntu-latest
    # one fit takes about 25 minutes, a 4-seed ensemble about 100
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        config: [pbp32_qb_e4, pbp32_e4, prod_e4, prod_qb_e4, prod, pbp32, pbp32_qb]
        season: [2021, 2022, 2023, 2024, 2025]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[wager]"
      - uses: actions/download-artifact@v4
        with: { name: cfb-games, path: data/cfb }
      - uses: actions/download-artifact@v4
        with: { name: "cfb-fold${{ matrix.season }}", path: "runs/foundation/cfb/fold${{ matrix.season }}" }
      - uses: actions/download-artifact@v4
        with: { name: cfb-playervalues, path: player_values/cfb }
      - name: Backtest ${{ matrix.config }} on ${{ matrix.season }}
        run: |
          python scripts/wager_arm.py ${{ matrix.config }} ${{ matrix.season }} --sport cfb \
            --experiment experiments/cfb/wager.yaml --output-dir runs/wager --threads $(nproc)
          mkdir -p out/${{ matrix.config }}
          cp runs/wager/${{ matrix.config }}/${{ matrix.season }}.csv out/${{ matrix.config }}/
      - uses: actions/upload-artifact@v4
        with: { name: "arm-${{ matrix.config }}-${{ matrix.season }}", path: out, retention-days: 30 }

  swap:
    needs: [games, data, folds]
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[wager]"
      - uses: actions/download-artifact@v4
        with: { name: cfb-games, path: data/cfb }
      - uses: actions/download-artifact@v4
        with: { name: cfb-fold2025, path: runs/foundation/cfb/fold2025 }
      - uses: actions/download-artifact@v4
        with: { name: cfb-playervalues, path: player_values/cfb }
      - uses: actions/download-artifact@v4
        with: { name: cfb-swapdata, path: data/cfb/processed }
      - uses: actions/download-artifact@v4
        with: { name: cfb-schedule, path: data/cfb/raw }
      - name: Swap test (2025, pbp32_qb_e4 fit on the seasons before)
        run: |
          mkdir -p out
          python scripts/cfb_lineup_swap.py --season 2025 --config pbp32_qb_e4 --out out/swap_2025.csv \
            --threads $(nproc)
          cat out/swap_2025.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: cfb-swap, path: out, retention-days: 30 }

  report:
    needs: [games, data, arms, swap]
    if: ${{ !cancelled() && needs.games.result == 'success' && needs.data.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[wager]"
      - uses: actions/download-artifact@v4
        with: { name: cfb-games, path: data/cfb }
      - uses: actions/download-artifact@v4
        with: { name: cfb-playervalues, path: player_values/cfb }
      - uses: actions/download-artifact@v4
        with: { pattern: "arm-*", path: experiments/cfb/wager, merge-multiple: true }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: cfb-swap, path: experiments/cfb/wager/swap }
      - name: Score
        run: |
          R=experiments/cfb/wager
          S="2021, 2022, 2023, 2024, 2025"
          ls $R
          # single seeds against prod
          O=$R/single; mkdir -p $O
          for c in prod pbp32 pbp32_qb; do [ -d $R/$c ] && cp -r $R/$c $O/; done
          # the 4-seed ensembles against each other
          E=$R/e4; mkdir -p $E
          for c in prod_e4 pbp32_e4 pbp32_qb_e4 prod_qb_e4; do [ -d $R/$c ] && cp -r $R/$c $E/; done
          python - <<PY
          import pathlib
          from runitback.wager.experiments import ablate
          seasons = [$S]
          for d, base in (("$O", "prod"), ("$E", "prod_e4")):
              have = {p.name: {} for p in sorted(pathlib.Path(d).iterdir())
                      if p.is_dir() and all((p / f"{s}.csv").exists() for s in seasons)}
              print(d, "complete:", list(have))
              if base in have:
                  ablate("data/cfb/games.csv", "cfb", {base: {}} | have, seasons, d, base, 1, 1)
          PY
          python scripts/foundation_report.py $O --baseline prod --out $O/report.md
          python scripts/foundation_report.py $E --baseline prod_e4 --out $E/report.md
          python scripts/foundation_report.py $E --baseline pbp32_e4 --out $E/report_vs_pbp32.md
          python scripts/lineup_report.py $E --baseline prod_e4 --pv player_values/cfb/pv.parquet --sport cfb \
            --out $E/subsets.md
          python scripts/lineup_report.py $E --baseline pbp32_e4 --pv player_values/cfb/pv.parquet --sport cfb \
            --out $E/subsets_vs_pbp32.md
          {
            echo "## CFB wager experiment"
            echo "### 1 seed vs prod"; cat $O/ablation.md; echo; cat $O/report.md; echo
            echo "### 4 seeds vs prod_e4"; cat $E/ablation.md; echo; cat $E/report.md; echo
            echo "### 4 seeds vs pbp32_e4"; cat $E/report_vs_pbp32.md; echo
            echo "### QB-moved subsets (vs prod_e4)"; cat $E/subsets.md; echo
            echo "### Swap test"; cat $R/swap/swap_2025.md 2>/dev/null || echo "(no swap results)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: cfb-wager-results, path: experiments/cfb/wager, retention-days: 90 }
