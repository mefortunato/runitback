# W1 (docs/multisport/PLAN.md): the WNBA foundation folds (pbp32), one event generator per test season, each in
# its own job:
#
#   inputs (data, foundation: 5 backtest seasons + the next one) ─► report
#
# Data and the folds are rebuilt in the run (wnba-experiment-inputs.yml). Fold S's generator is trained on the
# games before the last 40% of season S-1 (validated on that 40%) and never sees S; its per-possession game
# embeddings are projected with a PCA fit on games before S. Seasons are calendar years: 2022-2026 are the
# backtest's, 2027 the fold for the next season's games. The report job checks those rules for every fold,
# prints the engine's replay agreement and summarizes validation loss, explained variance and a team-strength
# sanity check (scripts/nba_foundation_report.py), uploaded as wnba-foundation-results; the folds are kept as
# wnba-foundation-models.
#
# Runs when this file or wnba-experiment-inputs.yml changes on a claude/ branch, or by hand.
name: WNBA foundation

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Epoch counts to train every fold with (JSON list; 0 = the recipe's)"
        type: string
        default: "[0]"
  push:
    branches: ["claude/**"]
    paths:
      - .github/workflows/wnba-foundation.yml
      - .github/workflows/wnba-experiment-inputs.yml

permissions:
  contents: read

concurrency:
  group: wnba-foundation-${{ github.ref }}
  cancel-in-progress: true

env:
  MLFLOW_DISABLE_AGENT_HINT: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  inputs:
    uses: ./.github/workflows/wnba-experiment-inputs.yml
    with:
      seasons: "[2022, 2023, 2024, 2025, 2026, 2027]"
      # a push carries no inputs: the epoch counts it trains (the recipe's, 0, and the alternatives tried)
      epochs: ${{ inputs.epochs || '[0, 12, 20]' }}

  report:
    needs: inputs
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13", cache: pip }
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
      - uses: actions/download-artifact@v4
        with: { name: wnba-data, path: data/wnba/processed }
      - uses: actions/download-artifact@v4
        with: { pattern: "wnba-*fold*", path: folds }
      - name: Report
        run: |
          # wnba-fold<S> is the recipe's fold (runs/foundation), wnba-e<E>-fold<S> one trained for E epochs
          # (runs/foundation-e<E>); one report per epoch count, then the comparison
          mkdir -p out
          for d in folds/wnba-*fold*; do
            n=${d#folds/wnba-}; e=${n%fold*}; e=${e%-}
            root=runs/foundation${e:+-$e}; mkdir -p "$root"; mv "$d" "$root/fold${n##*fold}"
          done
          ls runs/*
          for root in runs/foundation*; do
            tag=${root#runs/foundation}; tag=${tag#-}; tag=${tag:-recipe}
            python scripts/nba_foundation_report.py "$root" --data data/wnba/processed \
              --out "out/report_$tag.md" --json "out/report_$tag.json"
          done
          [ -f out/report_recipe.md ] && cp out/report_recipe.md out/report.md
          python - <<'PY' | tee out/epochs.md
          import json, glob
          rows = {}
          for f in sorted(glob.glob("out/report_*.json")):
              tag = f[len("out/report_"):-len(".json")]
              for r in json.load(open(f)):
                  rows.setdefault(r["fold"], {})[tag] = r
          tags = sorted({t for v in rows.values() for t in v}, key=lambda t: (t != "recipe", int(t[1:]) if t[1:].isdigit() else 0))
          print("| fold | " + " | ".join(f"{t}: val loss / kept epoch / corr pbp32" for t in tags) + " |")
          print("|---|" + "---|" * len(tags))
          for s in sorted(rows):
              cells = []
              for t in tags:
                  r = rows[s].get(t)
                  cells.append("—" if r is None else f"{r['val_loss']:.4f} / {r['kept_epoch']} of {r['epochs']} / {r.get('corr_pbp32', float('nan')):.3f}")
              print(f"| {s} | " + " | ".join(cells) + " |")
          PY
          cp data/wnba/processed/replay.json out/replay.json
          python -c "import json; r = json.load(open('out/replay.json')); \
            print('engine replay agreement', r['agreement'], 'over', r['transitions'], 'transitions in', \
            r['games'], 'games')" | tee -a out/report.md
          cat out/report.md out/epochs.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: wnba-foundation-results, path: out, retention-days: 90 }
      - uses: actions/upload-artifact@v4
        with: { name: wnba-foundation-models, path: runs, retention-days: 90 }
