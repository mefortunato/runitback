# F3 (docs/multisport/PLAN.md): the college football wager model on the play-by-play foundation (pbp32,
# F1) and the starting-quarterback values (qb, F2), walk-forward over the last 5 complete seasons.
# Run by .github/workflows/cfb-wager-experiment.yml, which rebuilds every input in the run (games with
# lines, foundation folds keyed as the wager model keys teams, weekly QB values) and uploads the
# cfb-wager-results artifact; see experiments/cfb/README.md.
#   python scripts/wager_arm.py pbp32_qb_e4 2025 --sport cfb --experiment experiments/cfb/wager.yaml
#   prod          the S4d box-score production model (the baseline; settings pinned as in baseline.yaml)
#   pbp32         + the frozen foundation's 32-dim game embeddings in the history tokens
#   pbp32_qb      + the starting quarterback's value change vs the team's last 7 starters, through
#                 sign-constrained additive terms on margin and total (lineup set pvc, one group: QB)
#   prod_qb       the QB terms without the foundation (in case pbp32 does not pass)
# The *_e4 versions average 4 seeds: promotion decisions compare _e4 with _e4 (seed noise ±0.002).
seasons: [2021, 2022, 2023, 2024, 2025]
baseline: prod
configs:
  prod:
    model: &prod {history: 28, total_weight: 1.0, market_tokens: true, efficiency: true}
  pbp32:
    model: &pbp32 {<<: *prod, pbp: "runs/foundation/cfb/fold{season}/pbp_32_wager.parquet", pbp_dim: 32}
  pbp32_qb:
    model: &pbp32_qb {<<: *pbp32, lineup: "player_values/cfb/pv.parquet", lineup_set: pvc}
  prod_qb:
    model: &prod_qb {<<: *prod, lineup: "player_values/cfb/pv.parquet", lineup_set: pvc}
  prod_e4:
    model: *prod
    fit: {ensemble: 4}
  pbp32_e4:
    model: *pbp32
    fit: {ensemble: 4}
  pbp32_qb_e4:
    model: *pbp32_qb
    fit: {ensemble: 4}
  prod_qb_e4:
    model: *prod_qb
    fit: {ensemble: 4}
