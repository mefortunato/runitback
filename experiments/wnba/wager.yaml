# W2 (docs/multisport/PLAN.md): the WNBA wager model on the play-by-play foundation (pbp32, W1) and the
# player values (pvc: the NBA's possession-level values with the WNBA's settings, on the NBA's projected
# rotations), walk-forward over the last 5 complete seasons, as the NBA's N5 (experiments/nba/wager.yaml).
# Run by .github/workflows/wnba-wager-experiment.yml, which rebuilds every input in the run (games with
# lines and foundation folds from wnba-experiment-inputs.yml; on-court fives, projected lineups and weekly
# player values in its values job), trains each 4-seed ensemble's members in jobs of their own and uploads
# the wnba-wager-results artifact; see experiments/wnba/README.md.
#   python scripts/wager_arm.py pbp32_pvc_e4 2025 --sport wnba --experiment experiments/wnba/wager.yaml
#   prod          the S4a box-score production model (the baseline)
#   pbp32         + the frozen foundation's 32-dim game embeddings in the history tokens
#   pbp32_pvc     + each group's change in projected-rotation value vs the team's last 10
#                 rotations, through sign-constrained additive terms on margin and total
#   prod_pvc      the player values without the foundation (the NBA's promoted arm)
# The *_e4 versions average 4 seeds: promotion decisions compare _e4 with _e4 (seed noise ±0.002).
seasons: [2022, 2023, 2024, 2025, 2026]
baseline: prod
configs:
  prod: {}
  pbp32:
    model: {pbp: "runs/foundation/fold{season}/pbp_32.parquet", pbp_dim: 32}
  pbp32_pvc:
    model: {pbp: "runs/foundation/fold{season}/pbp_32.parquet", pbp_dim: 32,
            lineup: "player_values/wnba/pv.parquet", lineup_set: pvc}
  prod_e4:
    fit: {ensemble: 4}
  pbp32_e4:
    model: {pbp: "runs/foundation/fold{season}/pbp_32.parquet", pbp_dim: 32}
    fit: {ensemble: 4}
  pbp32_pvc_e4:
    model: {pbp: "runs/foundation/fold{season}/pbp_32.parquet", pbp_dim: 32,
            lineup: "player_values/wnba/pv.parquet", lineup_set: pvc}
    fit: {ensemble: 4}
  prod_pvc_e4:
    model: {lineup: "player_values/wnba/pv.parquet", lineup_set: pvc}
    fit: {ensemble: 4}
