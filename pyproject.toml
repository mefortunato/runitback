[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runitback"
version = "0.1.0"
description = "Run It Back: generate sports games one play at a time and simulate matchups (SportsDataverse data)"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2", "numpy", "pandas", "pyarrow", "fastapi", "uvicorn", "typer", "pydantic>=2",
]

[project.optional-dependencies]
data = ["sportsdataverse>=0.1.4"]
dev = ["pytest", "httpx"]
# game-level wager models (spread / moneyline / total), ported from sportsml
wager = [
  "httpx", "jsonargparse[signatures]", "lightning", "mlflow", "networkx", "nflreadpy", "omegaconf",
  "scikit-learn", "scipy", "torch_geometric", "torchmetrics", "tqdm", "umap-learn",
]
tune = ["optuna>=5.0.0"]

[project.scripts]
runitback = "runitback.cli:app"
runitback-wager = "runitback.wager.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"runitback.nfl" = ["releases.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
